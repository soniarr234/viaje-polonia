<div class="tabs">
  <button [class.active]="vista === 'transportes'" (click)="cambiarVista('transportes')">Transportes</button>
  <button [class.active]="vista === 'hoteles'" (click)="cambiarVista('hoteles')">Hoteles</button>
  <button [class.active]="vista === 'ciudades'" (click)="cambiarVista('ciudades')">Ciudades</button>
</div>

<div class="ruta-page">
  @if (vista === 'transportes') {
    <app-transportes></app-transportes>
  } @else if (vista === 'hoteles') {
    <app-hoteles></app-hoteles>
  } @else if (vista === 'ciudades') {
    <app-ciudades-ruta></app-ciudades-ruta>
  }
</div>
