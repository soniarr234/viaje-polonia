<div *ngIf="objetos.length === 0" class="empty-state">
  <div class="empty-icon">🧳</div>

  <h2>¡Tu maleta está vacía!</h2>

  <p>No seas vaga y haz la maleta</p>

  <button class="add-button" (click)="abrirModal()">+ Añadir objeto</button>
</div>

<div *ngIf="objetos.length > 0">
  <div class="progress-card">
    <div class="progress-header">
      <span>Equipaje preparado</span>
      <span>{{ porcentajeCompletado }}%</span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" [style.width.%]="porcentajeCompletado"></div>
    </div>
  </div>

  <button class="add-button" (click)="abrirModal()">+ Añadir objeto</button>

  <div *ngFor="let categoria of categorias">
    <div
      *ngIf="obtenerObjetosPorCategoria(categoria.nombre).length > 0"
      class="categoria-card"
      [ngClass]="'categoria-' + categoria.nombre"
    >
      <h3 class="categoria-titulo">{{ categoria.titulo }}</h3>

      <div
        class="objeto"
        [class.objeto-preparado]="objeto.preparado"
        *ngFor="
        let objeto of obtenerObjetosPorCategoria(
          categoria.nombre
        )
      "
      >
        <div class="objeto-info">
          <input
            type="checkbox"
            [checked]="objeto.preparado"
            (change)="toggleObjeto(objeto)"
          />

          <div class="objeto-texto">
            <strong [class.preparado]="objeto.preparado">
              {{ objeto.nombre }}
            </strong>

            <span class="cantidad-badge"> x{{ objeto.cantidad }} </span>
          </div>
        </div>

        <div class="acciones">
          <button class="edit-btn" (click)="editarObjeto(objeto)">
            <span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="1.5em"
                height="1.5em"
              >
                <path
                  fill="currentColor"
                  d="M3.548 20.938h16.9a.5.5 0 0 0 0-1h-16.9a.5.5 0 0 0 0 1M9.71 17.18a2.6 2.6 0 0 0 1.12-.65l9.54-9.54a1.75 1.75 0 0 0 0-2.47l-.94-.93a1.79 1.79 0 0 0-2.47 0l-9.54 9.53a2.5 2.5 0 0 0-.64 1.12L6.04 17a.74.74 0 0 0 .19.72a.77.77 0 0 0 .53.22Zm.41-1.36a1.47 1.47 0 0 1-.67.39l-.97.26l-1-1l.26-.97a1.5 1.5 0 0 1 .39-.67l.38-.37l1.99 1.99Zm1.09-1.08l-1.99-1.99l6.73-6.73l1.99 1.99Zm8.45-8.45L18.65 7.3l-1.99-1.99l1.01-1.02a.75.75 0 0 1 1.06 0l.93.94a.754.754 0 0 1 0 1.06"
                />
              </svg>
            </span>
          </button>

          <button class="delete-btn" (click)="eliminarObjeto(objeto)">
            <span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 20 20"
                width="1.3em"
                height="1.3em"
              >
                <path
                  fill="#ef4444"
                  d="m9.129 0l1.974.005c.778.094 1.46.46 2.022 1.078c.459.504.7 1.09.714 1.728h5.475a.69.69 0 0 1 .686.693a.69.69 0 0 1-.686.692l-1.836-.001v11.627c0 2.543-.949 4.178-3.041 4.178H5.419c-2.092 0-3.026-1.626-3.026-4.178V4.195H.686A.69.69 0 0 1 0 3.505c0-.383.307-.692.686-.692h5.47c.014-.514.205-1.035.554-1.55C7.23.495 8.042.074 9.129 0m6.977 4.195H3.764v11.627c0 1.888.52 2.794 1.655 2.794h9.018c1.139 0 1.67-.914 1.67-2.794zM6.716 6.34c.378 0 .685.31.685.692v8.05a.69.69 0 0 1-.686.692a.69.69 0 0 1-.685-.692v-8.05c0-.382.307-.692.685-.692m2.726 0c.38 0 .686.31.686.692v8.05a.69.69 0 0 1-.686.692a.69.69 0 0 1-.685-.692v-8.05c0-.382.307-.692.685-.692m2.728 0c.378 0 .685.31.685.692v8.05a.69.69 0 0 1-.685.692a.69.69 0 0 1-.686-.692v-8.05a.69.69 0 0 1 .686-.692M9.176 1.382c-.642.045-1.065.264-1.334.662c-.198.291-.297.543-.313.768l4.938-.001c-.014-.291-.129-.547-.352-.792c-.346-.38-.73-.586-1.093-.635z"
                />
              </svg>
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- --------------------------- Modal --------------------------- -->

<div class="modal-overlay" *ngIf="mostrarModal">
  <div class="modal">
    <h2>Añadir a la maleta</h2>

    <div class="row">
      <div class="field">
        <label>Nombre del objeto</label>

        <input
          type="text"
          [(ngModel)]="nuevoObjeto.nombre"
          placeholder="Pasaporte"
        />
      </div>

      <div class="field cantidad">
        <label>Cantidad</label>

        <input type="number" [(ngModel)]="nuevoObjeto.cantidad" min="1" />
      </div>
    </div>

    <div class="categorias-wrapper">
      <label class="categoria-label"> Categoría </label>

      <div class="categorias">
        <button
          type="button"
          class="categoria-btn"
          [class.active]="nuevoObjeto.categoria === 'ropa'"
          (click)="nuevoObjeto.categoria = 'ropa'"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 16 16"
            width="1.2em"
            height="1.2em"
          >
            <path
              fill="currentColor"
              fillRule="evenodd"
              d="M3.76 2H6v.473c.005.01.026.059.102.147c.103.12.265.263.473.4c.422.277.952.48 1.425.48s1.004-.203 1.425-.48c.208-.137.37-.28.474-.4c.075-.088.096-.137.101-.147V2h2.24l2.312 2.89l-1.237 4.327l-1.815-.908V14h-7V8.309l-1.815.908l-1.237-4.328z"
              clipRule="evenodd"

          </svg>
          Ropa
        </button>

        <button

          (click)="nuevoObjeto.categoria = 'aseo personal'"

            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 15 15"
            width="1.2em"
            height="1.2em"
          >

              fill="currentColor"

            />

          class="categoria-btn"

          class="categoria-btn"
          [class.active]="nuevoObjeto.categoria === 'otros'"
          (click)="nuevoObjeto.categoria = 'otros'"
