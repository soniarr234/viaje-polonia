<div class="card-container">
    <!-- Tarjeta con imagen de fondo -->
    <div class="adventure-card">
      <div class="card-overlay">
        
        <!-- Texto superior -->
        <span class="card-subtitle">La aventura comienza en</span>
        
        <!-- Contenedor del contador -->
        <div class="countdown-grid">
          
          <!-- Bloque Días -->
          <div class="time-block">
            <span class="time-number">{{ days | number:'2.0-0' }}</span>
            <span class="time-label">Días</span>
          </div>
          
          <span class="time-separator">:</span>
          
          <!-- Bloque Horas -->
          <div class="time-block">
            <span class="time-number">{{ hours | number:'2.0-0' }}</span>
            <span class="time-label">Hrs</span>
          </div>
          
          <span class="time-separator">:</span>
          
          <!-- Bloque Minutos -->
          <div class="time-block">
            <span class="time-number">{{ minutes | number:'2.0-0' }}</span>
            <span class="time-label">Mins</span>
          </div>
          
        </div>
      </div>
    </div>
  </div>
